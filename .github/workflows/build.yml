name: Build Android 16 ROM for Samsung A7 (SM-A750F)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Android 16 Source & Device Tree
        run: |
          mkdir android16 && cd android16
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.0 --git-lfs --depth=1 || repo init -u https://android.googlesource.com/platform/manifest -b main --depth=1
          
          mkdir -p device/samsung/a7y18nte
          git clone https://github.com/minimal-manifest-twrp/android_device_samsung_a7y18nte.git -b twrp-9.0 device/samsung/a7y18nte || true

      - name: Start Compilation
        run: |
          echo "Compiling Android 16 ROM for SM-A750F..."
          cd android16
          source build/envsetup.sh || true
