name: Fixed TWRP Build for SM-A750F
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential curl unzip

      - name: Download Device Tree Source
        run: |
          mkdir -p device/samsung/a7y18nte
          curl -sL https://github.com/minimal-manifest-twrp/android_device_samsung_a7y18nte/archive/refs/heads/twrp-9.0.zip -o sm-a750f.zip
          unzip -q sm-a750f.zip
          cp -r android_device_samsung_a7y18nte-twrp-9.0/* device/samsung/a7y18nte/

      - name: Confirm Files
        run: |
          ls -la device/samsung/a7y18nte/

      - name: Upload Device Tree Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-A750F_Device_Tree
          path: device/samsung/a7y18nte/
