name: TWRP Build for Samsung A7 2018 (SM-A750F)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential ccache curl git gperf libxml2-utils zip

      - name: Clone Device Tree and Build Tools
        run: |
          echo "Cloning SM-A750F device tree and initializing compilation..."
          git clone https://github.com/minimal-manifest-twrp/android_device_samsung_a7y18nte.git -b twrp-9.0 device/samsung/a7y18nte

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_SM-A750F
          path: device/samsung/a7y18nte/
