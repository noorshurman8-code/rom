name: Build ROM for Galaxy A7 2018

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3 repo

    - name: Initialize Source Code
      run: |
        mkdir -p ~/android
        cd ~/android
        repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree for A750F
      run: |
        cd ~/android
        git clone https://github.com/LineageOS/android_device_samsung_a7y18nte.git -b lineage-19.1 device/samsung/a7y18nte || true

    - name: Start Building ROM
      run: |
        cd ~/android
        source build/envsetup.sh
        lunch lineage_a7y18nte-userdebug || true
        mka bacon -j$(nproc --all) || true

    - name: Upload Output ROM ZIP
      uses: actions/upload-artifact@v3
      with:
        name: ROM-A750F
        path: ~/android/out/target/product/a7y18nte/*.zip
        
