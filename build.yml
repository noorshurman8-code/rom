.github/workflows/build.yml

on:name: Build Android 16 ROM for Galaxy A7 2018
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblibc6-dev-i386 libncurses5 libncurses5-dev libreadline-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3 repo

      - name: Initialize Source Code (Android 16 / LineageOS 23.0)
        run: |
          mkdir -p ~/android
          cd ~/android
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree for A750F
        run: |
          cd ~/android
          git clone https://github.com/LineageOS/android_device_samsung_a7y18nte.git -b lineage-23.0 device/samsung/a7y18nte

      - name: Start Building ROM
        run: |
          cd ~/android
          source build/envsetup.sh
          lunch lineage_a7y18nte-userdebug || true
          mka bacon -j$(nproc --all) || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-Android16-A750F
          path: ~/android/out/target/product/a7y18nte/*.zip
